    <path d="M40,6 L68,17 L68,40 C68,58 56,70 40,75 C24,70 12,58 12,40 L12,17 Z"/>
  </g>
  <g fill="#1b4332">
    <rect x="36" y="46" width="8" height="18" rx="2"/>
    <circle cx="40" cy="34" r="16"/>
    <circle cx="27" cy="42" r="11"/>
    <circle cx="53" cy="42" r="11"/>
  </g>

  <!-- wordmark: two-tone brand name -->
